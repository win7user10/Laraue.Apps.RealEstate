# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Restore dependencies
      run: dotnet restore src/Laraue.Apps.RealEstate.ApiHost
    
    - name: Build
      run: dotnet build src/Laraue.Apps.RealEstate.ApiHost --no-restore -c Release
    
    - name: Test
      run: dotnet test --filter 'Category!=IntegrationTest' --no-build --verbosity normal

    - name: Pack build output
      if: github.ref == 'refs/heads/main'
      run: tar -czf api-host.tar.gz -C src/Laraue.Apps.RealEstate.ApiHost/bin/Release/net10.0 .

    - name: Upload
      if: github.ref == 'refs/heads/main'
      uses: marcodallasanta/ssh-scp-deploy@v1.2.0
      with:
       host: ${{ secrets.SSH_HOST }} # "example.com"
       port: ${{ secrets.SSH_PORT }} # 22
       user: ${{ secrets.SSH_USER }} # "user"
       password: ${{ secrets.SSH_PASSWORD }} # "password"
       local: api-host.tar.gz
       remote: "/home/laraue/real-estate-api-host"
       post_upload:
        cd /home/laraue/real-estate-api-host && find . -mindepth 1 ! -name api-host.tar.gz -delete &&
        tar -xzf api-host.tar.gz && rm api-host.tar.gz
